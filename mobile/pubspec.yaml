name: asset_management
description: Android Asset Management Enterprise Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # HTTP Client
  dio: ^5.3.0

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Camera & Barcode
  image_picker: ^1.0.0
  mobile_scanner: ^3.5.0

  # GPS/Location
  geolocator: ^10.1.0

  # Authentication
  flutter_secure_storage: ^9.0.0

  # Date & Time
  intl: ^0.19.0

  # Utilities
  equatable: ^2.0.0
  logger: ^2.0.0

  # UI
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
